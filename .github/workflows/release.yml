name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/Release/* `
            -DestinationPath civ6AccessibilityLuaIntegration-${{ github.ref_name }}.zip

- name: Create GitHub Release
  uses: softprops/action-gh-release@v2
  with:
    files: civ6AccessibilityLuaIntegration-${{ github.ref_name }}.zip
    