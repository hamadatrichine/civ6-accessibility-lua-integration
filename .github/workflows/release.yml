name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build -A x64

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "civ6AccessibilityLuaIntegration-${{ github.ref_name }}.zip"
          if (Test-Path $zip) {
            Remove-Item $zip
          }
          Compress-Archive -Path build/Release/* -DestinationPath $zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: civ6AccessibilityLuaIntegration-${{ github.ref_name }}.zip
